                 </section>

         
</section>

    <!-- Abre a coluna direita, destinada ao carrossel de filmes -->
       <section class="col-12 col-md-6">

    <!--Esse bloco cria a estrutura inicial do Slide Show, definindo seu espaço na página e apresentando um título centralizado,
    utilizando classes do Bootstrap para adaptar o conteúdo a diferentes tamanhos de tela. -->
    <section class="col-12 text-center">
        <h4 class="primary-color">Horror movies</h4>
    </section>

    <!--: Esse bloco cria e configura o carrossel de imagens, utilizando recursos do Bootstrap
    para realizar transições automáticas a cada 3 segundos, permitindo apresentar diferentes conteúdos de forma dinâmica.-->
    <section class="container" id="container-carousel">
        <section class="carousel slide" id="slider" data-bs-ride="carousel" data-bs-interval="3000">

                           
          <!--Esse bloco cria os indicadores de navegação do carrossel, permitindo selecionar manualmente cada imagem. 
          Os botões são conectados ao carrossel por meio de atributos do Bootstrap e incluem recursos de acessibilidade.-->
           <section class="carousel-indicators">
            <button type="button" class="active" data-bs-target="#slider" data-bs-slide-to="0"
            aria-current="true" aria-label="Slide 1"></button>

            <button type="button" data-bs-target="#slider" data-bs-slide-to="1"
             aria-label="Slide 2"></button>

            <button type="button" data-bs-target="#slider" data-bs-slide-to="2"
            aria-label="Slide 3"></button>
            </section>

        
<!-- Área das imagens do carrossel -->
<section class="carousel-inner">

    <!-- Primeira imagem -->
    <section class="carousel-item active">
        <img class="d-block w-100"
             src="img/iluminado.JPEG"
             alt="Imagem de Halloween 1">

        <section class="carousel-caption">
            <h4>O Iluminado</h4>
        <a href="https://melkberg.com/2020/10/21/resumo-explicacao-filme-o-iluminado/"
            class="btn btn-primary"
            target="_blank"
            rel="noopener noreferrer">
            Conheça o filme
        </a>
        </section>
    </section>

    <!-- Segunda imagem -->
    <section class="carousel-item">
        <img class="d-block w-100"
             src="img/bruxa.JPEG"
             alt="Imagem de Halloween 2">

        <section class="carousel-caption">
            <h4>A Bruxa</h4>
           <a href="https://www.unifal-mg.edu.br/portal/2021/10/29/resenha-do-filme-a-bruxa-transgressor-intenso-e-dramatico-na-medida-certa-para-quem-aprecia-terror-psicologico-por-bianca-maia-roque/"
           class="btn btn-primary"
           target="_blank"
           rel="noopener noreferrer">
            Conheça o fime
        </a>
        
        </section>
    </section>

    <!-- Terceira imagem -->
    <section class="carousel-item">
        <img class="d-block w-100"
             src="img/transilvania.JPEG"
             alt="Imagem de Halloween 3">

        <section class="carousel-caption">
            <h4>Hotel Transilvânia</h4>
           <a href="https://ims.com.br/filme/hotel-transilvania/"
           class="btn btn-primary"
           target="_blank"
           rel="noopener noreferrer">
            Conheça o filme
</a>
            </a>
        </section>
    </section>

</section>
